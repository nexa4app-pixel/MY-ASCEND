name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release Windows 11 Desktop App
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite (100% Pass Required)
        run: npm test

      - name: Verify TypeScript compilation & Frontend Build
        run: npm run build

      - name: Build Tauri Desktop Package (.msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MY ASCEND ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 MY ASCEND Release ${{ github.ref_name }}
            
            ### ✨ Windows 11 Desktop Application (.msi)
            - **Installer (MSI):** Enterprise-ready Windows Installer package (.msi).
            - **Architecture:** x64 Native Windows 11 Build with WebView2 embedding.
            - **Security:** AES-256 Key Derivation, SHA-256 PIN Lock & Auto-Lock Protection.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
